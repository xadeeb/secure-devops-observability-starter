services:
  app:
    build: .
    image: secure-devops-starter:local
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: local
      LOG_LEVEL: INFO
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
